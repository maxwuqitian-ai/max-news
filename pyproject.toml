[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "global-daily-news-agent"
version = "0.1.0"
description = "Source-grounded Chinese daily news briefing with Gmail delivery"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "feedparser>=6,<7", "PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "respx>=0.21,<1"]

[project.scripts]
news-agent = "news_agent.cli:main"

[tool.setuptools.packages.find]
include = ["news_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
