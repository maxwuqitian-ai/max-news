name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deployment-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEWS_SENDER: ${{ secrets.NEWS_SENDER }}
      NEWS_RECIPIENT: ${{ secrets.NEWS_RECIPIENT }}
    steps:
      - name: Check RESEND_API_KEY
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('RESEND_API_KEY'):
              raise SystemExit('Missing GitHub Actions Secret: RESEND_API_KEY')
          PY
      - name: Check NEWS_SENDER
        if: always()
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('NEWS_SENDER'):
              raise SystemExit('Missing GitHub Actions Secret: NEWS_SENDER')
          PY
      - name: Check NEWS_RECIPIENT
        if: always()
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('NEWS_RECIPIENT'):
              raise SystemExit('Missing GitHub Actions Secret: NEWS_RECIPIENT')
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q
