name: Diagnose generation latency
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Up to three completed daily-news run IDs, comma-separated
        required: true
        type: string
permissions:
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read selected workflow logs without mailing or exposing credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          ids = os.environ['RUN_IDS'].split(',')
          if not 1 <= len(ids) <= 3 or any(not re.fullmatch(r'[1-9][0-9]*', x) for x in ids):
              raise SystemExit('Supply up to three numeric run IDs')
          for run_id in ids:
              print('RUN ' + run_id)
              result = subprocess.run(['gh', 'run', 'view', run_id, '--repo',
                  os.environ['GITHUB_REPOSITORY'], '--log'], capture_output=True, text=True, check=True)
              for line in result.stdout.splitlines():
                  if re.search(r' (INFO|WARNING|ERROR) news_agent\.', line):
                      print(line[:2000])
          PY
